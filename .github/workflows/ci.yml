name: CI

# Command lists live in the root Makefile, not here, so this workflow and
# the local pre-push hook cannot drift apart. Dependency installation and
# browser setup stay as named steps for readable per-step failure output.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make check-py

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        run: npm ci
        working-directory: app
      - run: make check-app
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: app
      - run: make e2e
