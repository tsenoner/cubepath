[project]
name = "cubepath"
version = "0.1.0"
description = "Rubik's Cube guide: from Beginner to 2-Look CFOP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "svgwrite>=1.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
cubepath-diagrams = "cubepath.diagrams:main"
cubepath-cards = "cubepath.cheatcards:main"
# deprecated alias, kept so an old command still works
cubepath-cheatcards = "cubepath.cheatcards:main"
cubepath-logo = "cubepath.logo:main"

[dependency-groups]
dev = ["ruff>=0.11", "pytest>=8", "mypy>=1.14"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
pretty = true

# svgwrite ships no py.typed marker and has no stubs on typeshed.
[[tool.mypy.overrides]]
module = "svgwrite.*"
ignore_missing_imports = true

# Tests are assertion-heavy and only half-annotated; requiring signatures there
# buys nothing the assertions do not already prove.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
